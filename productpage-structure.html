<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0>
	<title>product-name, GUNI STORE</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel=stylesheet>
	<link rel="stylesheet" href="css/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
</head>

<body>
	<header class="site-header">
		<div class="logo">
			<img src="images/logo-header.png" alt="Guni Store Logo" class="logo-header">
		</div>
		<nav aria-label="Main">
			<ul class="nav-list">
				<li><a href="index.html">Home</a></li>
				<li><a href="shop.html" aria-current="page">Shop</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="contact.html">Contact</a></li>
			</ul>
		</nav>
	</header>

<main>
	<section class="product-page">
		<div class="product-image" data-product-name="Everyday Comfort Tee" data-product-price="₱?">
			<img src="images/everyday-comfort-tee.jpg" alt="Everyday Comfort Tee">

		</div>
		<div class="product-info">
			<h1>Everyday Comfort Tee</h1>
			<p class="product-price">₱250(?)</p>
			<p class="product-description">TBA desc from stella</p>

			<form id="order-form">
				<div class="size-selection">
					<label for="size">Size</label>
					<select id="size" name="size">
						<option value="">Select a size</option>
						<option value="S">Small</option>
						<option value="M">Medium</option>
						<option value="L">Large</option>
						<option value="XL">Extra Large</option>
					</select>
				</div>

				<div class="quantity-selection">
					<label for="quantity">Quantity</label>
					<input type="number" id=quantity" name="quantity" min="1" value="1">
				</div>

				<button type= "button" id="order-btn">Order Now</button>
			</form>

			<p id="order-feedback" aria-live="polite"></p>
		</div>
	</section>
</main>
